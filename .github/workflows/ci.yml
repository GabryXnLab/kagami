name: CI

# La CI di chiunque: runner di GitHub e nessun servizio esterno, quindi gira
# uguale in questo repo e in ogni fork. È autonoma di proposito: i reusable del
# manutentore (build-android.yml & co.) stanno in repo privati, e GitHub non li
# lascia chiamare da un repo pubblico. Vedi .github/workflows/CLAUDE.md.
run-name: CI · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '📱 Modalità dell APK. release = quello da installare. debug = diagnostica. profile = misure di prestazioni.'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
  # La build di release.yml: stessi controlli, stesso APK.
  workflow_call:
    inputs:
      build_mode:
        type: string
        default: 'release'
    secrets:
      GOOGLE_SERVICES_JSON:
        required: false
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      SENTRY_DSN:
        required: false

permissions:
  contents: read

# Con il nome del workflow: chiamato da release.yml vale il nome di quello, e un push
# su main non annulla una release in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La stessa di CLAUDE.md: si aggiornano insieme.
  FLUTTER_VERSION: '3.47.4'

jobs:
  check:
    name: Analisi e test
    # In un repo privato (il manutentore, o un fork chiuso) da solo a mano: lì ci sono
    # altre CI, e questa a ogni push costerebbe i minuti del piano.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # I .g.dart di drift sono in git: uno schema cambiato senza rigenerarli
      # compila lo stesso e si scopre solo a runtime.
      - name: Codice generato allineato
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      - run: flutter analyze
      - run: flutter test
      # Il motore dell'archivio e il server sono Dart puro, con il loro pubspec:
      # la radice non li analizza né li prova.
      - name: Archiviatore e server
        run: |
          for package in packages/kagami_archive server; do
            (cd "$package" && dart pub get && dart analyze && dart test)
          done

  server-image:
    name: Immagine del server
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Il target `test` fa girare anche i test che vogliono libvips.
      - run: docker build -f server/Dockerfile --target test .

  android:
    name: APK
    needs: check
    # Nelle PR da un fork i secret non ci sono, e un APK senza non serve a nessuno.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Tutti e tre facoltativi (vedi README): senza google-services.json l'APK
      # nasce senza account né Drive, senza DSN Sentry resta spento.
      - name: Configurazione di chi compila
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json: sì" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "google-services.json: no, APK senza account né Drive" >> "$GITHUB_STEP_SUMMARY"
          fi
          # La chiave di debug di ogni runner è nuova: senza la propria, l'APK
          # non si installa sopra il precedente e Google non ne riconosce
          # l'impronta per l'accesso. Passa da key.properties e non da
          # ~/.android/debug.keystore, che sui runner di GitHub Gradle ignora e
          # rigenera. I default sono quelli di una chiave di debug.
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/kagami.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/kagami.keystore"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD:-android}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-androiddebugkey}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-android}}"
            } > android/key.properties
          fi
      - run: flutter pub get
      - run: flutter build apk --"$BUILD_MODE" --dart-define=SENTRY_DSN="$SENTRY_DSN"
      # L'impronta da registrare in Firebase: con un'altra l'accesso con Google fallisce.
      - name: Impronta della firma
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "build/app/outputs/flutter-apk/app-$BUILD_MODE.apk" \
            | grep 'SHA-1' | sed 's/^/firma: /' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: kagami-${{ env.BUILD_MODE }}
          path: build/app/outputs/flutter-apk/app-${{ env.BUILD_MODE }}.apk
          if-no-files-found: error
