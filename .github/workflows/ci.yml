name: CI

# La CI di chiunque: runner di GitHub e nessun servizio esterno, quindi gira
# uguale in questo repo e in ogni fork. È autonoma di proposito: analisi, test e
# l'APK di release.yml non dipendono da nessun altro repo. Gli APK e l'IPA di ogni
# push su main li fa build.yml. Vedi .github/workflows/CLAUDE.md.
run-name: CI · ${{ github.ref_name }}

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      build_mode:
        description: '📱 Modalità dell APK. release = quello da installare. debug = diagnostica. profile = misure di prestazioni.'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
          - profile
      split_per_abi:
        description: '🏗️ Un APK per architettura (arm64-v8a, armeabi-v7a, x86_64) invece di uno che le contiene tutte.'
        required: false
        default: false
        type: boolean
  # I controlli di release.yml, che gli APK e l'IPA li prende da build.yml.
  workflow_call:
    inputs:
      build_mode:
        type: string
        default: 'release'
      split_per_abi:
        type: boolean
        default: false
      build_apk:
        type: boolean
        default: true
    secrets:
      GOOGLE_SERVICES_JSON:
        required: false
      ANDROID_KEYSTORE:
        required: false
      ANDROID_KEYSTORE_PASSWORD:
        required: false
      ANDROID_KEY_ALIAS:
        required: false
      ANDROID_KEY_PASSWORD:
        required: false
      SENTRY_DSN:
        required: false
      GOOGLE_SERVER_CLIENT_SECRET:
        required: false

permissions:
  contents: read

# Con il nome del workflow: chiamato da release.yml vale il nome di quello, e un push
# su main non annulla una release in corso.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # La stessa di CLAUDE.md: si aggiornano insieme.
  FLUTTER_VERSION: '3.47.4'

jobs:
  check:
    name: Analisi e test
    # In un repo privato (il manutentore, o un fork chiuso) da solo a mano: lì ci sono
    # altre CI, e questa a ogni push costerebbe i minuti del piano.
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # I .g.dart di drift sono in git: uno schema cambiato senza rigenerarli
      # compila lo stesso e si scopre solo a runtime.
      - name: Codice generato allineato
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- '*.g.dart'
      - run: flutter analyze
      - run: flutter test
      # Il motore dell'archivio e il server sono Dart puro, con il loro pubspec:
      # la radice non li analizza né li prova.
      - name: Archiviatore e server
        run: |
          for package in packages/kagami_archive server; do
            (cd "$package" && dart pub get && dart analyze && dart test)
          done

  server-image:
    name: Immagine del server
    if: ${{ !github.event.repository.private || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Il target `test` fa girare anche i test che vogliono libvips.
      - run: docker build -f server/Dockerfile --target test .

  # L'immagine che il comando generato dall'app scarica: una per architettura, sul
  # runner nativo (Dart sotto QEMU compila piano e a volte si pianta), poi un indice
  # che le riunisce sotto lo stesso nome. Solo dal pubblico e solo da main: è quella
  # che usa chiunque abbia l'app.
  server-publish:
    name: Pubblica il server (${{ matrix.arch }})
    needs: [check, server-image]
    if: ${{ !github.event.repository.private && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Nome dell'immagine
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kagami-server" >> "$GITHUB_ENV"
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.description=Kagami Server: scarica i manga sul Drive di chi li chiede
            org.opencontainers.image.licenses=GPL-3.0-only
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=server-${{ matrix.arch }}
      - name: Impronta
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  server-manifest:
    name: Pubblica il server
    needs: server-publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: server-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `latest` è quello del comando dell'app; lo sha resta per tornare indietro.
      - name: Indice multi-architettura
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/kagami-server"
          docker buildx imagetools create -t "$image:latest" -t "$image:sha-${GITHUB_SHA::7}" \
            $(printf "$image@sha256:%s " *)
          docker buildx imagetools inspect "$image:latest"
          echo "Immagine: \`$image:latest\`" >> "$GITHUB_STEP_SUMMARY"

  android:
    name: APK
    needs: check
    # Solo a mano o da release.yml (che parte a mano, e qui ne vale l'evento): l'APK di
    # ogni push su main lo fa build.yml, con quelli per architettura e l'IPA. Nelle PR
    # da un fork i secret non ci sono, e un APK senza non serve a nessuno.
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk != false
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GOOGLE_SERVER_CLIENT_SECRET: ${{ secrets.GOOGLE_SERVER_CLIENT_SECRET }}
      BUILD_MODE: ${{ inputs.build_mode || 'release' }}
      SPLIT_PER_ABI: ${{ inputs.split_per_abi && 'true' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # Tutti e tre facoltativi (vedi README): senza google-services.json l'APK
      # nasce senza account né Drive, senza DSN Sentry resta spento.
      - name: Configurazione di chi compila
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json: sì" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "google-services.json: no, APK senza account né Drive" >> "$GITHUB_STEP_SUMMARY"
          fi
          # La chiave di debug di ogni runner è nuova: senza la propria, l'APK
          # non si installa sopra il precedente e Google non ne riconosce
          # l'impronta per l'accesso. Passa da key.properties e non da
          # ~/.android/debug.keystore, che sui runner di GitHub Gradle ignora e
          # rigenera. I default sono quelli di una chiave di debug.
          if [ -n "$ANDROID_KEYSTORE" ]; then
            printf '%s' "$ANDROID_KEYSTORE" | base64 -d > "$RUNNER_TEMP/kagami.keystore"
            {
              echo "storeFile=$RUNNER_TEMP/kagami.keystore"
              echo "storePassword=${ANDROID_KEYSTORE_PASSWORD:-android}"
              echo "keyAlias=${ANDROID_KEY_ALIAS:-androiddebugkey}"
              echo "keyPassword=${ANDROID_KEY_PASSWORD:-${ANDROID_KEYSTORE_PASSWORD:-android}}"
            } > android/key.properties
          fi
      - run: flutter pub get
      - run: flutter build apk --"$BUILD_MODE" ${SPLIT_PER_ABI:+--split-per-abi} --dart-define=SENTRY_DSN="$SENTRY_DSN" --dart-define=GOOGLE_SERVER_CLIENT_SECRET="$GOOGLE_SERVER_CLIENT_SECRET"
      # L'impronta da registrare in Firebase: con un'altra l'accesso con Google fallisce.
      - name: Impronta della firma
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          for apk in build/app/outputs/flutter-apk/app*-"$BUILD_MODE".apk; do
            "$apksigner" verify --print-certs "$apk" \
              | grep 'SHA-1' | sed "s|^|$(basename "$apk"): |" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: kagami-${{ env.BUILD_MODE }}
          path: build/app/outputs/flutter-apk/app*-${{ env.BUILD_MODE }}.apk
          if-no-files-found: error
