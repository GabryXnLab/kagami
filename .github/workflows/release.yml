name: Release

# Una release pubblica: la versione di pubspec.yaml, costruita da ci.yml con tutti i
# suoi controlli e firmata con la chiave di release, in una GitHub Release con il suo
# SHA-256. Si lancia a mano da main dopo aver alzato `version` in pubspec.yaml.
run-name: Release · ${{ github.ref_name }}

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    name: Versione
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Una versione pubblicata non si ripubblica: chi ha l'APK deve poter contare
      # su un numero che indica sempre lo stesso file.
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::version non trovata in pubspec.yaml"
            exit 1
          fi
          if gh release view "v$version" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::v$version esiste già: alza version in pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Analisi e test di ci.yml, senza il suo APK: gli APK e l'IPA li fa build.yml. Pubblica
  # anche l'immagine del server come `stable` e `v<versione>` (con il catalogo dei secret).
  check:
    name: Controlli
    needs: version
    # I job di ci.yml chiedono packages: write (immagine del server): un workflow chiamato
    # non può avere più permessi del chiamante, senza questo il run è startup_failure.
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/ci.yml
    secrets:
      CATALOG_URLS: ${{ secrets.CATALOG_URLS }}
      CATALOG_KEYS: ${{ secrets.CATALOG_KEYS }}
    with:
      build_apk: false
      release_version: ${{ needs.version.outputs.version }}

  build:
    name: Build
    needs: [version, check]
    uses: ./.github/workflows/build.yml
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
      GOOGLE_SERVER_CLIENT_SECRET: ${{ secrets.GOOGLE_SERVER_CLIENT_SECRET }}
      BACKEND_URL: ${{ secrets.BACKEND_URL }}
      BACKEND_ANON_KEY: ${{ secrets.BACKEND_ANON_KEY }}
      GOOGLE_SERVER_CLIENT_ID: ${{ secrets.GOOGLE_SERVER_CLIENT_ID }}
      CATALOG_URLS: ${{ secrets.CATALOG_URLS }}
      CATALOG_KEYS: ${{ secrets.CATALOG_KEYS }}

  publish:
    name: Pubblica
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      # SHA-1 della chiave di release attesa: variabile del repo (Settings → Variables), mai nel codice.
      EXPECTED_SHA1: ${{ vars.ANDROID_RELEASE_SHA1 }}
    steps:
      # Gli artefatti di flutter-ci si chiamano <app>-<piattaforma>-<modo>[-per-abi]-<sha>.
      - uses: actions/download-artifact@v4
        with:
          pattern: Kagami-*-release*-${{ github.sha }}
          merge-multiple: true
          path: dist
      # Gli aggiornamenti si installano solo sopra un APK con la stessa firma: una
      # release firmata con una chiave di debug legherebbe per sempre chi la installa.
      - name: Firma e impronte
        run: |
          if [ -z "$EXPECTED_SHA1" ]; then
            echo "::error::variabile ANDROID_RELEASE_SHA1 mancante: serve la SHA-1 della chiave di release"
            exit 1
          fi
          expected=$(tr -d ':[:space:]' <<< "$EXPECTED_SHA1" | tr 'A-F' 'a-f')
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          mkdir out
          for abi in arm64-v8a armeabi-v7a x86_64 universal; do
            if [ "$abi" = universal ]; then src=dist/app-release.apk; else src="dist/app-$abi-release.apk"; fi
            apk="out/kagami-$VERSION-$abi.apk"
            mv "$src" "$apk"
            certs=$("$apksigner" verify --print-certs "$apk")
            if grep -q 'CN=Android Debug' <<< "$certs"; then
              echo "::error::$apk firmato con una chiave di debug: servono i secret ANDROID_KEYSTORE* della chiave di release"
              exit 1
            fi
            actual=$(sed -n 's/.*certificate SHA-1 digest: *//p' <<< "$certs" | head -1 | tr -d ':[:space:]' | tr 'A-F' 'a-f')
            if [ "$actual" != "$expected" ]; then
              echo "::error::$apk ha SHA-1 ${actual:-assente}, diversa dalla chiave di release attesa"
              exit 1
            fi
          done
          mv dist/Kagami-ios-release-unsigned.ipa "out/kagami-$VERSION-ios-unsigned.ipa"
          (cd out && sha256sum ./* | sed 's| \./| |' > "kagami-$VERSION.sha256")
          {
            echo "Quale scaricare:"
            echo
            echo "- \`arm64-v8a\`: quasi ogni telefono Android dal 2017 in poi. Nel dubbio, questo."
            echo "- \`armeabi-v7a\`: telefoni a 32 bit, vecchi o economici."
            echo "- \`x86_64\`: emulatori e pochi tablet con processore Intel."
            echo "- \`universal\`: tutte e tre le architetture in un file solo, più pesante."
            echo "- \`ios-unsigned.ipa\`: iPhone e iPad, non firmato: si installa con AltStore o"
            echo "  Sideloadly. Su iOS account, Drive e i lavori in background non ci sono."
            echo
            echo "Scegliete un APK e restateci: quelli per architettura hanno un \`versionCode\`"
            echo "più alto dell'universale, che quindi non si installa sopra di loro."
            echo
            echo "Firma degli APK:"
            echo '```'
            "$apksigner" verify --print-certs "out/kagami-$VERSION-arm64-v8a.apk" | grep -E 'SHA-256 digest'
            echo '```'
          } > notes.md
      - name: Release
        run: |
          gh release create "v$VERSION" out/* \
            -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --title "Kagami $VERSION" \
            --notes-file notes.md --generate-notes

  # Gli artefatti di build e di CI riempiono la quota del repo e, piena, Pubblica fallisce.
  # Parte solo se la release è finita senza errori (needs senza condizioni: con un job
  # fallito o saltato non gira) e tiene gli artefatti della run precedente e di questa.
  cleanup:
    name: Pulizia artefatti
    needs: [version, check, build, publish]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Cancella gli artefatti più vecchi della run precedente
        run: |
          prev=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?per_page=10" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | .[0].created_at // empty")
          if [ -z "$prev" ]; then
            echo "Nessuna run precedente: niente da cancellare."
            exit 0
          fi
          echo "Cancello gli artefatti creati prima di $prev"
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/artifacts?per_page=100" \
            --jq ".artifacts[] | select(.created_at < \"$prev\" and .workflow_run.id != $GITHUB_RUN_ID) | .id" |
          while read -r id; do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/actions/artifacts/$id" && echo "cancellato $id"
          done
