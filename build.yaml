# Le date vanno salvate come testo ISO-8601 e non come secondi unix: tutta
# l'app ragiona in UTC e la memorizzazione numerica le riporterebbe in ora
# locale, sfalsando i raggruppamenti per giorno delle statistiche.
targets:
  $default:
    builders:
      drift_dev:
        options:
          store_date_time_values_as_text: true
