# Kagami Server con Docker Compose, per chi lo costruisce dal sorgente. Chi
# non vuole il sorgente usa il comando `docker run` che genera l'app, con
# l'immagine già pronta. Dalla cartella server/:
#   KAGAMI_SETUP=<dall'app> docker compose up -d
#   docker compose logs kagami-server
# Guida completa: docs/server.md.
services:
  kagami-server:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: kagami-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Il tuo fuso orario (es. Europe/Rome): decide l'ora del controllo delle
      # serie in corso. Si prende da TZ della shell, se c'è.
      TZ: ${TZ:-UTC}
      # La configurazione generata dall'app (Altro → Scarica un manga →
      # Server → Crea il tuo server): progetto, client e il tuo Drive. Si
      # applica al primo avvio e quando cambia; poi può anche restare vuota.
      KAGAMI_SETUP: ${KAGAMI_SETUP:-}
    volumes:
      - kagami-data:/data

volumes:
  kagami-data:
